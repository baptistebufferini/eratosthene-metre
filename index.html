<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>De la Terre d'Ératosthène au mètre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lib/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Filtres SVG : bords usés du parchemin et trait « à la plume » -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="usure"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="3"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
    <filter id="plume"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
  </svg>

  <button class="bouton-son" id="bouton-son" type="button"></button>

  <div class="livre" id="livre">
    <aside class="panneau" id="panneau">
      <button class="panneau-bascule" id="panneau-bascule" aria-expanded="false" aria-controls="panneau-contenu">Carte et carnet</button>
      <div class="panneau-contenu" id="panneau-contenu">
        <div class="carte" id="carte" aria-label="Progression"></div>
        <h2 class="carnet-titre">Carnet de notes</h2>
        <ol class="carnet" id="carnet"><li class="carnet-vide">Tes résultats s'inscriront ici.</li></ol>
        <p class="code-reprise" id="code-reprise" hidden>Code de reprise : <strong></strong><br><small>Note-le pour continuer sur un autre appareil.</small></p>
      </div>
    </aside>

    <main class="page" id="page" tabindex="-1"></main>
  </div>

  <div class="scene-popup" id="scene-popup" hidden></div>
  <div class="calculatrice" id="calculatrice" hidden></div>
  <div class="clavier" id="clavier" hidden></div>
  <div class="tampon" id="tampon" aria-hidden="true"></div>

  <script src="lib/katex/katex.min.js"></script>
  <script src="lib/katex/auto-render.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
